<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <title>Announcements — eSHCAT</title>
  <link rel="icon" href="../assets/logo/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-page="announcements">
  <main>
    <section class="page-hero">
      <h1>Announcements</h1>
      <p>Official announcements and advisories from the Municipal Government.</p>
    </section>
    <div class="container">
      <section class="section">
        <div class="chips" id="announcementChips" role="group" aria-label="Filter announcements" style="margin-bottom:22px">
          <button type="button" class="chip active" data-cat="">All</button>
          <button type="button" class="chip" data-cat="Government">Government</button>
          <button type="button" class="chip" data-cat="Services">Services</button>
          <button type="button" class="chip" data-cat="Health">Health</button>
          <button type="button" class="chip" data-cat="Emergency">Emergency</button>
        </div>
        <div id="announcementsList">
          <div class="loading"><span class="spinner"></span><span>Loading announcements...</span></div>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/announcements.js"></script>
</body>
</html>
