<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <title>Staff Login — eSHCAT</title>
  <link rel="icon" href="../../assets/logo/favicon.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/staff.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-page="staff-login">
  <main>
    <div class="container">
      <section class="section">
        <form id="loginForm" class="auth-card" novalidate>
          <div class="icon-tile" style="margin-bottom:14px">🔐</div>
          <h1>Staff Login</h1>
          <p class="sub">Municipal staff portal for eSHCAT</p>

          <div class="form-group" style="margin-bottom:14px">
            <label for="loginEmail">Email / Username</label>
            <input type="email" id="loginEmail" autocomplete="username" required />
          </div>
          <div class="form-group" style="margin-bottom:18px">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" autocomplete="current-password" required />
          </div>
          <button class="btn btn-primary" id="loginBtn" type="submit" style="width:100%">Login</button>

          <div class="alert info" style="margin-top:18px;font-size:0.82rem">
            <span>Demo account — email: <strong>staff@eshcat.local</strong> · password: <strong>change_me_123</strong></span>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="../../js/utils.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/staff/auth.js"></script>
</body>
</html>
