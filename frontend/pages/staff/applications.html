<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <title>Applications — eSHCAT Staff</title>
  <link rel="icon" href="../../assets/logo/favicon.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/staff.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-page="staff-applications" data-require-auth class="staff-body">
  <main>
    <div class="staff-shell">
      <aside class="staff-sidebar" aria-label="Staff navigation">
        <div class="side-brand">
          <span class="mark">eS</span>
          <span><strong>eSHCAT</strong><small>Staff Portal</small></span>
        </div>
        <nav class="side-nav">
          <span class="nav-section">Main</span>
          <a href="dashboard.html"><span class="ico"><i class="fa-solid fa-chart-simple" aria-hidden="true"></i></span>Dashboard</a>
          <a class="active" href="applications.html"><span class="ico"><i class="fa-solid fa-folder-open" aria-hidden="true"></i></span>Applications</a>
          <span class="nav-section">More</span>
          <a href="appointments.html"><span class="ico"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i></span>Appointments</a>
          <a href="reports.html"><span class="ico"><i class="fa-solid fa-flag" aria-hidden="true"></i></span>Reports</a>
          <a href="messages.html"><span class="ico"><i class="fa-solid fa-comment-dots" aria-hidden="true"></i></span>Messages</a>
          <a href="settings.html"><span class="ico"><i class="fa-solid fa-gear" aria-hidden="true"></i></span>Settings</a>
        </nav>
        <div class="side-user">
          <span id="userChip"></span>
          <button class="side-user-logout" data-logout title="Log out" aria-label="Log out"><i class="fa-solid fa-power-off" aria-hidden="true"></i></button>
        </div>
      </aside>

      <div class="staff-main">
        <div class="staff-top">
          <div>
            <h1>Applications</h1>
            <div class="sub">Review, update, and forward citizen applications</div>
          </div>
          <div class="top-actions">
            <button class="btn btn-secondary btn-sm" id="refreshBtn" type="button"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Refresh</button>
          </div>
        </div>

        <div class="toolbar">
          <div class="grow">
            <input type="search" id="filterSearch" placeholder="Search reference, applicant, or service..." aria-label="Search applications" autocomplete="off" />
          </div>
          <select id="filterStatus" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option>Submitted</option>
            <option>Received</option>
            <option>Under Review</option>
            <option>Additional Requirements</option>
            <option>For Verification</option>
            <option>Forwarded</option>
            <option>Approved</option>
            <option>Rejected</option>
            <option>Not Found</option>
            <option>Ready for Release</option>
            <option>Completed</option>
            <option>Cancelled</option>
          </select>
          <select id="filterDept" aria-label="Filter by department">
            <option value="">All departments</option>
          </select>
        </div>

        <div id="applicationsTable">
          <div class="loading"><span class="spinner"></span><span>Loading applications...</span></div>
        </div>
      </div>
    </div>
  </main>

  <script src="../../js/utils.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/staff/auth.js"></script>
  <script src="../../js/staff/applications.js"></script>
</body>
</html>
