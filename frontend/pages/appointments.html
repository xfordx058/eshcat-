<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <title>Request an Appointment — eSHCAT</title>
  <link rel="icon" href="../assets/logo/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-page="appointments">
  <main>
    <div class="container">
      <section class="section">
        <p class="note"><a href="javascript:history.back()">← Back</a></p>
        <div style="margin-top:8px;margin-bottom:22px">
          <div class="kicker">Appointments</div>
          <h1 style="font-size:1.6rem">Request an Office Appointment</h1>
          <p class="note">Schedule a visit with a municipal office. No account required.</p>
        </div>
        <form id="appointmentForm" class="glass-card" style="max-width:620px;margin:0 auto">
          <div class="form-group full">
            <label for="deptSelect">Office</label>
            <select id="deptSelect" required>
              <option value="">Select an office...</option>
            </select>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label for="apptDate">Date</label>
              <input type="date" id="apptDate" required />
            </div>
            <div class="form-group">
              <label for="apptTime">Time</label>
              <input type="time" id="apptTime" required />
            </div>
            <div class="form-group">
              <label for="apptName">Full Name</label>
              <input type="text" id="apptName" required />
            </div>
            <div class="form-group">
              <label for="apptEmail">Email</label>
              <input type="email" id="apptEmail" required />
            </div>
            <div class="form-group">
              <label for="apptMobile">Mobile Number</label>
              <input type="tel" id="apptMobile" />
            </div>
          </div>
          <button class="btn btn-primary" id="apptBtn" type="submit" style="width:100%;margin-top:16px">Request Appointment →</button>
        </form>
      </section>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/appointments.js"></script>
</body>
</html>
