<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <title>Municipal Services — eSHCAT</title>
  <link rel="icon" href="../assets/logo/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-page="services">
  <main>
    <section class="page-hero">
      <h1>Municipal Services</h1>
      <p>Browse services, view requirements, and apply online — no account needed.</p>
    </section>
    <div class="container">
      <section class="section">
        <div class="glass-card" style="margin-bottom:24px">
          <form class="search-strip" role="search" id="serviceSearchForm">
            <input type="search" id="serviceSearch" placeholder="Search municipal services..." aria-label="Search services" autocomplete="off" />
            <button class="btn btn-primary" type="submit">Search</button>
          </form>
        </div>
        <div id="serviceList">
          <div class="loading"><span class="spinner"></span><span>Loading services...</span></div>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/services.js"></script>
</body>
</html>
