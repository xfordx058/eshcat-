<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <title>Municipal Services — eSHCAT</title>
  <meta name="description" content="Browse Catarman municipal services, view requirements, and apply online." />
  <link rel="icon" href="../assets/logo/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/services.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-page="services" class="services-page">
  <main>
    <section class="page-hero">
      <h1>Municipal Services</h1>
      <p>Browse services, view requirements, and apply online — no account needed.</p>
    </section>
    <div class="container">
      <section class="section">
        <div class="split-narrow services-layout" style="align-items:start">
          <aside class="card filter-panel" aria-label="Filters" style="position:sticky;top:calc(var(--header-h) + 20px)">
            <h3 style="margin-bottom:14px">Find a Service</h3>
            <form id="serviceSearchForm" role="search" style="margin-bottom:16px">
              <input type="search" id="serviceSearch" placeholder="Search services..." aria-label="Search services" autocomplete="off" />
            </form>
            <p class="note" style="margin-bottom:10px;font-size:0.82rem;font-weight:600">Filter by department</p>
            <div class="chips category-list" id="categoryChips" style="flex-direction:column;align-items:stretch"></div>
          </aside>
          <div>
            <div id="serviceList">
              <div class="loading"><span class="spinner"></span><span>Loading services...</span></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/services.js"></script>
</body>
</html>
