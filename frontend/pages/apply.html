<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <title>Apply — eSHCAT</title>
  <link rel="icon" href="../assets/logo/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-page="apply">
  <main>
    <div class="container">
      <section class="section">
        <p class="note"><a href="javascript:history.back()"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to service</a></p>
        <div class="progress-steps" aria-label="Application progress">
          <div class="progress-step active" data-wizard-step="1"><span class="num">01</span><span class="lbl">Information</span></div>
          <div class="progress-connector" data-wizard-connector="1"></div>
          <div class="progress-step" data-wizard-step="2"><span class="num">02</span><span class="lbl">Requirements</span></div>
          <div class="progress-connector" data-wizard-connector="2"></div>
          <div class="progress-step" data-wizard-step="3"><span class="num">03</span><span class="lbl">Review</span></div>
          <div class="progress-connector" data-wizard-connector="3"></div>
          <div class="progress-step" data-wizard-step="4"><span class="num">04</span><span class="lbl">Submit</span></div>
        </div>
        <div style="margin-top:8px;margin-bottom:20px;text-align:center">
          <div class="dept" id="serviceDept">Loading...</div>
          <h1 id="serviceName" style="font-size:1.6rem">Application</h1>
          <p class="note" id="serviceDesc">Fill in the required information. You will receive a reference number after submission.</p>
        </div>
        <div id="applyForm">
          <div class="loading"><span class="spinner"></span><span>Loading application form...</span></div>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/applications.js"></script>
</body>
</html>
