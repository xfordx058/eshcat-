<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <title>Track Request — eSHCAT</title>
  <link rel="icon" href="../assets/logo/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-page="track">
  <main>
    <section class="page-hero">
      <h1>Track Your Request</h1>
      <p>Enter your eSHCAT reference number to view the current status.</p>
    </section>
    <div class="container">
      <section class="section">
        <form id="trackForm" class="glass-card" style="max-width:560px;margin:0 auto 24px">
          <label for="referenceInput">Reference Number</label>
          <input type="text" id="referenceInput" placeholder="CAT-DC-7F3A91D2" autocomplete="off" spellcheck="false" />
          <button class="btn btn-primary" type="submit" style="width:100%;margin-top:14px">Track Request</button>
        </form>
        <div id="trackResult"></div>
      </section>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/tracking.js"></script>
</body>
</html>
