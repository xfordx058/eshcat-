<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <title>Report a Concern — eSHCAT</title>
  <link rel="icon" href="../assets/logo/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-page="reports">
  <main>
    <div class="container">
      <section class="section">
        <p class="note"><a href="javascript:history.back()">← Back</a></p>
        <div style="margin-top:8px;margin-bottom:22px">
          <div class="kicker">Community Reports</div>
          <h1 style="font-size:1.6rem">Report a Community Concern</h1>
          <p class="note">Help keep Catarman connected. Report issues without creating an account.</p>
        </div>
        <form id="reportForm" class="glass-card" style="max-width:620px;margin:0 auto">
          <div class="form-grid">
            <div class="form-group">
              <label for="reportCategory">Concern Category</label>
              <select id="reportCategory" required>
                <option value="">Select category...</option>
                <option>Road problem</option>
                <option>Streetlight</option>
                <option>Drainage</option>
                <option>Waste</option>
                <option>Flooding</option>
                <option>Public facility</option>
                <option>Environment</option>
                <option>Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="reportLocation">Location</label>
              <input type="text" id="reportLocation" placeholder="e.g. Rizal St., Brgy. 1" />
            </div>
            <div class="form-group full">
              <label for="reportDescription">Description</label>
              <textarea id="reportDescription" rows="4" placeholder="Describe the concern..." required></textarea>
            </div>
            <div class="form-group">
              <label for="reportName">Your Name</label>
              <input type="text" id="reportName" />
            </div>
            <div class="form-group">
              <label for="reportEmail">Email</label>
              <input type="email" id="reportEmail" />
            </div>
          </div>
          <button class="btn btn-primary" id="reportBtn" type="submit" style="width:100%;margin-top:16px">Submit Report →</button>
        </form>
      </section>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/reports.js"></script>
</body>
</html>
